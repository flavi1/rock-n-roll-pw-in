# =============================================================================
#  rock-n-roll-pw-in — réception du son par le réseau (côté Raspberry Pi)
#  Emplacement actif : /etc/rock-n-roll-pw-in/pw-in.conf
#
#  CE FICHIER EST DÉPLOYÉ DEPUIS LE DÉPÔT GIT À CHAQUE MISE À JOUR (l'ancien est
#  gardé : pw-in.conf.avant-maj). Réglages propres à CETTE Pi, non publiés :
#  /etc/rock-n-roll-pw-in/local.conf (mêmes sections, lu après, jamais écrasé).
#
#  Après modification : sudo rock-n-roll-pw-in apply
#  État               : sudo rock-n-roll-pw-in status
# =============================================================================

[global]
# Utilisateur qui exécute PipeWire (auto = celui de pi-sound-server, sinon hifi)
user = auto
# Sortie vers laquelle le son reçu est envoyé (auto = MASTER de pi-sound-server)
target = auto
# Qualité du rééchantillonnage d'ajustement d'horloge (auto = celle de pi-sound-server)
resample.quality = auto
# Journal du récepteur : 2 = avertissements (défaut) ; 3 = aussi chaque paquet
# perdu / désordonné et chaque resynchronisation (diagnostic des coupures) :
#   sudo journalctl _UID=$(id -u hifi) --user-unit=rock-n-roll-rtp -f
log-level = 2

# =============================================================================
#  RTP « classique » : son non compressé, réseau local uniquement.
#  Un seul émetteur à la fois : le premier qui envoie garde la place tant qu'il
#  envoie (même du silence) ; elle se libère release-seconds après son dernier
#  paquet. Côté PC : dépôt rock-n-roll-pw-out (mêmes port / format / fréquence).
# =============================================================================
[rtp]
enabled = yes
# Port UDP de réception
port = 46000
# Tampon de réception (ms) : absorbe les irrégularités du réseau.
# Ethernet : 10 (5 possible) ; Wi-Fi : 50 à 200.
latency-ms = 10
# Format attendu : DOIT être identique à celui de l'émetteur
rate = 192000
format = S24BE
channels = 2
# Délai (s) sans paquet avant qu'un autre émetteur puisse prendre la place
# (vaut aussi pour ROC : un seul émetteur à la fois, tous protocoles confondus)
release-seconds = 5
# Nom affiché (audio-hub status, wpctl…)
description = Réseau (RTP)

# =============================================================================
#  ROC (optionnel) : comme RTP, avec en plus la correction des paquets perdus
#  (Reed-Solomon) et un tampon plus grand : pour le Wi-Fi ou un réseau imparfait.
#  192 kHz, flottant 32 bits, stéréo. Programme rock-n-roll-roc (libroc),
#  compilé à l'installation : s'il n'a pas pu l'être, seul RTP fonctionne.
#  Côté PC : rock-n-roll-pw-out, sortie « Hifi — réseau (ROC 192 kHz) ».
# =============================================================================
[roc]
enabled = yes
# Ports UDP : flux corrigé (source + réparation) et flux simple (émetteur dont la
# libroc n'a pas la correction d'erreur, ex. Ubuntu) ; la Pi écoute les deux
source-port = 10001
repair-port = 10002
plain-port = 10003
# auto (correction si possible) | rs8m | ldpc | none
fec = auto
# Latence totale visée (ms) : marge pour réparer les pertes. Ethernet : 40 à 80 ;
# Wi-Fi : 80 à 200.
latency-ms = 80
rate = 192000
description = Réseau (ROC)
