# ROC (optionnel) : vrais envois / réceptions d'un sinus avec libroc, sans PipeWire.
#   Debian trixie : libroc 0.3 avec correction d'erreur (= la Pi)
#   Ubuntu 24.04  : libroc 0.3 sans correction (OpenFEC absent)
#   Ubuntu 26.04  : libroc 0.4 (= PC récent)
# Pertes de paquets simulées (netem sur lo, partagé avec les conteneurs).
name: ROC

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roc:
    name: Envoi / réception réels (0.3, 0.4, avec et sans correction)
    runs-on: ubuntu-24.04
    env:
      SECS: "9"
    steps:
      - uses: actions/checkout@v5
      - name: libroc sur l'hôte (Ubuntu 24.04) et conteneurs (Debian trixie, Ubuntu 26.04)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libroc-dev pkg-config >/dev/null
          BIN=$PWD/r-u2404 bash tests/test-roc.sh build
          for c in "trixie debian:trixie" "u2604 ubuntu:26.04"; do
            set -- $c
            docker run -d --name "$1" --network host -v "$PWD:/w" -w /w "$2" sleep 3600
            docker exec "$1" bash -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gcc libc6-dev libroc-dev pkg-config python3 python3-numpy >/dev/null'
            docker exec "$1" env BIN=/w/r-$1 bash tests/test-roc.sh build
          done
          sudo modprobe sch_netem || sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" >/dev/null && sudo modprobe sch_netem || true

      - name: "Ubuntu 24.04 (sans correction), sans perte"
        run: ROC_CASE="u2404 seul" bash tests/test-roc.sh pair "env BIN=$PWD/r-u2404" "env BIN=$PWD/r-u2404"
      - name: "Debian trixie (la Pi), sans perte"
        run: ROC_CASE="trixie seul" bash tests/test-roc.sh pair "docker exec trixie env BIN=/w/r-trixie" "docker exec trixie env BIN=/w/r-trixie"
      - name: "Ubuntu 26.04 (libroc 0.4), sans perte"
        run: ROC_CASE="u2604 seul" bash tests/test-roc.sh pair "docker exec u2604 env BIN=/w/r-u2604" "docker exec u2604 env BIN=/w/r-u2604"
      - name: "Pi (trixie 0.3) reçoit, PC 24.04 (0.3 sans correction) envoie"
        run: ROC_CASE="trixie <- u2404" bash tests/test-roc.sh pair "docker exec trixie env BIN=/w/r-trixie" "env BIN=$PWD/r-u2404"
      - name: "Pi (trixie 0.3) reçoit, PC 26.04 (0.4) envoie"
        run: ROC_CASE="trixie <- u2604" bash tests/test-roc.sh pair "docker exec trixie env BIN=/w/r-trixie" "docker exec u2604 env BIN=/w/r-u2604"
      - name: "Comparaison sans perte (informatif)"
        continue-on-error: true
        run: |
          for o in "--resampler speex --no-tuner" "--resampler default --no-tuner" "--resampler-profile high" "--no-tuner"; do
            ROC_RECV_OPTS="$o" ROC_CASE="trixie 0% $o" bash tests/test-roc.sh pair "docker exec -e ROC_RECV_OPTS trixie env BIN=/w/r-trixie" "docker exec trixie env BIN=/w/r-trixie" || true
          done
      - name: "Dérive d'horloge ±2000 ppm, 45 s (informatif)"
        continue-on-error: true
        run: |
          for d in 2000 -2000; do
            for o in "--resampler speex --no-tuner" "--resampler-profile high"; do
              SECS=45 ROC_DRIFT_PPM=$d ROC_RECV_OPTS="$o" ROC_CASE="trixie dérive $d ppm $o" bash tests/test-roc.sh pair "docker exec -e ROC_RECV_OPTS -e SECS trixie env BIN=/w/r-trixie" "docker exec -e ROC_DRIFT_PPM -e SECS trixie env BIN=/w/r-trixie" || true
            done
          done
      - name: "Pertes simulées : 5 %"
        run: sudo tc qdisc add dev lo root netem loss 5%
      - name: "Debian trixie, 5 % de pertes : corrigées"
        run: ROC_CASE="trixie 5%" bash tests/test-roc.sh pair "docker exec trixie env BIN=/w/r-trixie" "docker exec trixie env BIN=/w/r-trixie"
      - name: "Debian trixie, 5 % de pertes, sans correction : le banc les voit"
        if: always()
        run: ROC_CASE="trixie 5% none" bash tests/test-roc.sh pair "docker exec trixie env BIN=/w/r-trixie" "docker exec trixie env BIN=/w/r-trixie" none glitches
      - name: "Pi (trixie) reçoit, PC 26.04 (sans correction) envoie, 5 % de pertes : audibles"
        if: always()
        run: ROC_CASE="trixie <- u2604 5%" bash tests/test-roc.sh pair "docker exec trixie env BIN=/w/r-trixie" "docker exec u2604 env BIN=/w/r-u2604" auto glitches
      - name: "Comparaison avec pertes (informatif)"
        if: always()
        continue-on-error: true
        run: |
          for o in "--resampler speex --no-tuner" "--resampler-profile high"; do
            ROC_RECV_OPTS="$o" ROC_CASE="trixie 5% $o" bash tests/test-roc.sh pair "docker exec -e ROC_RECV_OPTS trixie env BIN=/w/r-trixie" "docker exec trixie env BIN=/w/r-trixie" || true
          done
      - name: "Sans pertes simulées"
        if: always()
        run: sudo tc qdisc del dev lo root
